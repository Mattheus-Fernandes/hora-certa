<div class="w-full mt-10">
   
   <form [ngSwitch]="step" [formGroup]="appointmentForm">

      <div *ngSwitchCase="1" class="flex flex-col gap-2">
         <label class="block text-blue-950" [class.text-red-500]="invalidCustomerId">Cliente a ser atendido(a)*</label>

         <nz-select  [nzStatus]="invalidCustomerId" formControlName="customerId" nzAllowClear nzPlaceHolder="Selecionar cliente">
            <nz-option *ngFor="let customer of customersList" [nzValue]="customer.id"
               [nzLabel]="customer.name + ' ' + customer.lastname">
            </nz-option>
         </nz-select>
      </div>

      <div *ngSwitchCase="2" class="flex flex-col gap-2">
         <label class="block text-blue-950" [class.text-red-500]="invalidAppointmentDate">Data do atendimento*</label>
         <nz-date-picker [nzStatus]="invalidAppointmentDate" formControlName="appointmentDate" nzFormat="dd/MM/yyyy"></nz-date-picker>
      </div>

      <div *ngSwitchCase="3" class="flex flex-col gap-2">
         <label class="block text-blue-950" [class.text-red-500]="invalidAppointmentTime">Horário do atendimento*</label>
         <nz-time-picker [nzStatus]="invalidAppointmentTime" formControlName="appointmentTime" nzFormat="HH:mm"></nz-time-picker>
      </div>

      <div *ngSwitchCase="4" class="flex flex-col gap-2">
         <label class="block text-blue-950" [class.text-red-500]="invalidServiceName">Serviço a ser realizado*</label>
         <nz-select [nzStatus]="invalidServiceName" formControlName="serviceName" nzAllowClear nzPlaceHolder="Selecionar serviço">
            <nz-option *ngFor="let service of kindServiceList" [nzValue]="service.value" [nzLabel]="service.title">
            </nz-option>
         </nz-select>
      </div>

      <div *ngSwitchCase="5" class="flex flex-col gap-2">
         <div>
            <p class="text-xs text-gray-400">Opcional</p>
            <label class="block text-blue-950">Observação para o atendimento</label>
         </div>
         <input formControlName="observation" nz-input placeholder="Observação" />
      </div>

   </form>

   <div class="mt-10 flex justify-between">
      <button nz-button nzType="default" (click)="previousStep()" [disabled]="step === 1">
         Voltar
      </button>

      <button nz-button nzType="primary" (click)="nextStep()">
         {{ step === 5 ? 'Finalizar' : 'Avançar' }}
      </button>
   </div>
</div>
