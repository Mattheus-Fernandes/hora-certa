<div class="h-dvh flex flex-col">
   <app-header (toggleSideBar)="getToggleSideBar()" [statusIcon]="changeStatusIcon"></app-header>

   <div class="flex-1 flex flex-col pt-4 p-5 gap-5 relative overflow-hidden">
      <div class="hidden md:flex md:justify-end gap-5">
         <ng-container *ngFor="let button of buttonNavegationList">
            <button nz-button [nzType]="button.nzType" nzGhost [routerLink]="button.routerLink">{{button.title}}</button>
         </ng-container>
      </div>

     <div class="flex-1">
      <app-sidebar [toggle]="toggleSideBar" (toggleSidebar)="getToggleSideBar($event)"></app-sidebar>   
      <router-outlet></router-outlet>
     </div>
   </div>
</div>
